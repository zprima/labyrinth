<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labyrinth — A little time to get lost</title><meta name="description" content="Generate a fresh maze, pick your size, and draw your way from start to finish."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23272925'/%3E%3Cpath d='M8 6v20h16V12H14v8h4M14 6h10' fill='none' stroke='%23e8f482' stroke-width='3'/%3E%3C/svg%3E">  <script type="module" crossorigin src="./index-XZDb6Z8g.js"></script>
  <link rel="stylesheet" crossorigin href="./index-DXCIMZ2V.css">
</head>
<body>
  <div class="app">
    <header>
      <span class="brand">labyrinth<span class="period">.</span></span>
    </header>
    <main>
      <section class="settings" aria-label="Maze controls">
        <div class="size-control">
          <label for="size">Maze size <output id="size-value" for="size">16 × 16</output></label>
          <input id="size" type="range" min="6" max="40" value="16" step="1">
        </div>
        <button id="generate" class="primary">New maze</button>
      </section>
      <section class="play" aria-label="Maze puzzle">
        <div class="paper">
          <div class="paper-top"><span><i class="dot"></i>Start</span><span>Maze <span id="number">001</span></span></div>
          <div class="maze-stage">
          <canvas id="maze" tabindex="0" role="application" aria-label="Maze. Use arrow keys to draw a path from the top left entrance to the bottom right exit." aria-describedby="instructions status"></canvas>
        <div class="movement-controls">
          <div class="direction-pad" role="group" aria-label="Move through the maze" aria-describedby="pad-help">
            <button type="button" class="direction up" data-direction="0" aria-label="Move up">↑</button>
            <button type="button" class="direction left" data-direction="3" aria-label="Move left">←</button>
            <button type="button" class="direction down" data-direction="2" aria-label="Move down">↓</button>
            <button type="button" class="direction right" data-direction="1" aria-label="Move right">→</button>
          </div>
          <p id="pad-help">Tap to move.<br>Hold to keep going.</p>
        </div>
          </div>
          <div class="paper-bottom"><span id="status" role="status" aria-live="polite">Start at the blue dot.</span><span class="finish">Exit ↘</span></div>
        </div>
        <div class="toolbar">
          <details>
            <summary>How to play</summary>
            <p id="instructions">Use the direction buttons to move the blue tip. Tap for one cell, or hold to move along a passage. Move backward to undo a wrong turn. You can also draw directly on the maze or use the arrow keys.</p>
          </details>
          <button id="clear" class="clear">Clear trail</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
