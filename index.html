<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labyrinth — A little time to get lost</title><meta name="description" content="Generate a fresh maze, pick your size, and draw your way from start to finish."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23272925'/%3E%3Cpath d='M8 6v20h16V12H14v8h4M14 6h10' fill='none' stroke='%23e8f482' stroke-width='3'/%3E%3C/svg%3E">  <script type="module" crossorigin src="./index-DiNB30XF.js"></script>
  <link rel="stylesheet" crossorigin href="./index-CIPfJ38i.css">
</head>
<body>
  <div class="app">
    <header>
      <span class="brand">labyrinth<span class="period">.</span></span>
    </header>
    <main>
      <section class="settings" aria-label="Maze controls">
        <div class="size-control">
          <label for="size">Maze size <output id="size-value" for="size">16 × 16</output></label>
          <input id="size" type="range" min="6" max="40" value="16" step="1">
        </div>
        <button id="generate" class="primary">New maze</button>
      </section>
      <section class="play" aria-label="Maze puzzle">
        <div class="paper">
          <div class="paper-top"><span><i class="dot"></i>Start</span><span>Maze <span id="number">001</span></span></div>
          <canvas id="maze" tabindex="0" role="application" aria-label="Maze. Use arrow keys to draw a path from the top left entrance to the bottom right exit." aria-describedby="instructions status"></canvas>
          <div class="paper-bottom"><span id="status" role="status" aria-live="polite">Start at the blue dot.</span><span class="finish">Exit ↘</span></div>
        </div>
        <div class="toolbar">
          <details>
            <summary>How to play</summary>
            <p id="instructions">Drag from the blue dot to draw your route. Trace backward to erase a wrong turn. Lift your finger and continue from the blue tip. You can also focus the maze and use the arrow keys.</p>
          </details>
          <button id="clear" class="clear">Clear trail</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
